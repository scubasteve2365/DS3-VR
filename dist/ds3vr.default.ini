[ds3vr]
; DS3 VR settings. Most of these are set from the in-game VR menu (click both thumbsticks, or Insert).

; 0 = mod switched off (the game runs as if it were not installed)
Enabled=1
OpenXR=1
; World scale 0.25 (largest world) to 10.0 (smallest); 1.0 is life size. Higher makes the world look
; smaller, with more 3D depth. Set it in the menu (General tab).
WorldScale=1.0
; HUD panel. HudMode: 0 = fixed in front of you, 1 = follows your head, 2 = hidden.
HudMode=0
; width, distance from your eyes, and how far below eye level, in metres
HudWidth=1.0
HudDistance=1.2
HudDrop=0.10
; 1 = HUD on its own panel; 0 = leave it in the 3D image
HudPanel=1
; Decoupled pitch (menu, General tab): 0 = off, 1 = level view (the horizon stays level; the right stick
; still raises and lowers the camera), 2 = level view and the right stick's up/down is ignored
HorizonLock=0
; 1 = head movement grows with the world scale (matches the 3D depth); 0 = life size
ScaleHeadMovement=1
; NVIDIA DLSS (menu, Graphics tab; needs an NVIDIA RTX graphics card): 0 = off, 1 = DLAA (anti-aliasing),
; 2 = Quality, 3 = Balanced, 4 = Performance, 5 = Ultra Performance (upscaling: the game renders smaller
; and DLSS rebuilds the image at the headset's resolution; a change applies at the next launch)
DlssMode=0
; DLSS model: 6 = CNN (default, faster), 11 = transformer, 0 = the driver's choice
DlaaPreset=6
; Sharpening of the headset image: 0 = off, 1 = low, 2 = medium, 3 = high, 4 = maximum
Sharpening=0
; Developer mode (menu, Developer tab): 1 = test settings, F1 snapshot, F2 draw recording and a detailed
; ds3vr.log. 0 = off (only problems are logged).
DevKeys=0

; ---- Advanced: leave these alone unless asked ----
; height the game renders each eye at. 0 = what the VR runtime asks for (your runtime's resolution setting;
; a change there takes effect on the next launch). -1 = leave the game's own resolution alone.
RenderWidth=0
RenderHeight=0
; frame rate cap. 0 = the headset's refresh rate, -1 = the game's own 60, or a number (e.g. 72, 90, 120).
FrameRate=0
; 1 = keep running and rolling correct above 60 fps
FixHighFpsMovement=1
; vertical field of view in degrees. 0 = automatic (matches the headset).
FovY=0
; camera updates between applying a head pose and that frame reaching the headset (2 = steadiest)
PoseLag=2
; which half of geo-11's stereo image holds the left eye
LeftEyeHalf=1
; extra distance in metres behind the game camera (0 = none)
CameraPullback=0

[state]
SettingsVersion=2
